<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRIA · Cliente Cockpit (mockup 2 níveis)</title>
<style>
  :root{--laranja:#EA4918;--amarelo:#FFCF03;--azul:#0061EE;--rosa:#FF77B9;--verde:#01A652;--lilas:#7C90F0;
    --tinta:#1c1c1a;--cinza:#6b6b66;--linha:#ece9dd;--creme:#F5F3E7;--card:#fff;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--creme);color:var(--tinta);font-family:'Plus Jakarta Sans',-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 18px 60px}
  .muted{color:var(--cinza)}
  svg.ic{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
  .scn{display:flex;gap:8px;align-items:center;margin-bottom:14px;background:#fff;border:1px solid var(--linha);border-radius:14px;padding:8px 10px;flex-wrap:wrap}
  .scn .lb{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#b3b0a4;margin-right:4px}
  .scn button{border:1px solid var(--linha);background:#fdfdfb;border-radius:10px;padding:8px 13px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--cinza)}
  .scn button.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
  /* header */
  .chead{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--linha);border-radius:22px;padding:18px 20px;margin-bottom:14px;box-shadow:0 8px 26px rgba(0,0,0,.04)}
  .avatar{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.12)}
  .chead h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.3px}
  .chead .sub{font-size:13px;margin-top:2px}
  .chead .right{margin-left:auto;display:flex;gap:8px}
  .hbtn{border:1px solid var(--linha);background:#fdfdfb;border-radius:11px;padding:8px 12px;font:inherit;font-weight:700;font-size:12px;cursor:pointer;color:var(--tinta);display:inline-flex;align-items:center;gap:6px}
  /* NAV nível 1 */
  .nav{display:flex;gap:7px;flex-wrap:wrap;background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:8px;margin-bottom:16px}
  .n1{border:none;background:transparent;font:inherit;font-weight:700;font-size:13.5px;color:var(--cinza);padding:10px 15px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .n1 .mc{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:#fff}
  .n1 .mc svg.ic{width:13px;height:13px}
  .n1.active{background:var(--tinta);color:#fff}
  .n1.lock{opacity:.5}
  .n1 .lk{color:#b3b0a4}
  @media(max-width:820px){.nav{overflow-x:auto;flex-wrap:nowrap}}
  /* seções */
  .sechead{display:flex;align-items:center;gap:9px;margin:2px 2px 11px;font-size:16px;font-weight:800}
  .sechead .mc{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff}
  .sechead small{font-weight:600;font-size:12.5px;color:var(--cinza);margin-left:2px}
  .card{background:var(--card);border:1px solid var(--linha);border-radius:20px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.03)}
  /* base grid */
  .basegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
  @media(max-width:820px){.basegrid{grid-template-columns:1fr 1fr}}
  .bx{border:1px solid var(--linha);border-radius:14px;padding:12px 13px;background:#fdfdfb}
  .bx .k{font-size:10px;color:#b3b0a4;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
  .bx .v{font-size:14px;font-weight:700;margin-top:5px}
  .bx .hint{font-size:10.5px;color:#b3b0a4;margin-top:4px}
  .anot{margin-top:11px;border:1px solid var(--linha);border-radius:14px;padding:13px;background:#fdfdfb}
  .anot .k{font-size:10px;color:#b3b0a4;font-weight:800;text-transform:uppercase;letter-spacing:.08em;display:flex}
  .anot textarea{width:100%;border:none;background:transparent;resize:none;font:inherit;font-size:13px;color:var(--tinta);margin-top:6px;min-height:40px;outline:none}
  /* cards de sub-assunto (nível 2) */
  .subgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
  @media(max-width:820px){.subgrid{grid-template-columns:1fr}}
  .subcard{background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:17px;cursor:pointer;transition:.15s;box-shadow:0 5px 16px rgba(0,0,0,.03);position:relative}
  .subcard:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.07)}
  .subcard .top{display:flex;align-items:center;gap:11px}
  .subcard .si{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
  .subcard .st{font-size:15px;font-weight:800}
  .subcard .sd{font-size:12.5px;color:var(--cinza);margin-top:9px;line-height:1.45}
  .subcard .foot{display:flex;align-items:center;margin-top:13px;gap:8px}
  .badge{font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--creme);color:var(--cinza)}
  .badge.hot{background:#FFF1EC;color:var(--laranja)}
  .subcard .go{margin-left:auto;font-size:12px;font-weight:800;color:var(--tinta);display:inline-flex;align-items:center;gap:5px}
  /* highlights na visão geral */
  .hl{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:6px}
  @media(max-width:820px){.hl{grid-template-columns:1fr}}
  .fitem{display:flex;gap:11px;align-items:center;padding:10px 11px;border:1px solid var(--linha);border-radius:13px;background:#fdfdfb;margin-top:8px}
  .fitem .t{font-weight:700;font-size:13px}.fitem .d{font-size:11px;color:var(--cinza);margin-top:1px}
  .fitem .st{margin-left:auto;font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .waiting{background:#FFF7DA;color:#8a6d00}.adjust{background:#FFE7EF;color:#b02a63}.aged{color:var(--laranja);font-weight:800}
  .fin{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .finbox{border:1px solid var(--linha);border-radius:13px;padding:11px;background:#fdfdfb}
  .finbox .k{font-size:11px;color:var(--cinza);font-weight:700}.finbox .v{font-size:17px;font-weight:800;margin-top:2px}
  .ttl{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:2px}
  .goto{margin-left:auto;border:1px solid var(--linha);background:#fdfdfb;border-radius:10px;padding:5px 10px;font:inherit;font-weight:700;font-size:11px;cursor:pointer;color:var(--tinta);display:inline-flex;align-items:center;gap:5px}
  /* upsell */
  .ups{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px dashed var(--linha);border-radius:16px;padding:12px 14px;margin-top:14px}
  .ups .ut{font-size:12.5px;font-weight:800}
  .modchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--linha);background:#fdfdfb;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;color:var(--tinta)}
  .modchip .mc{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;color:#fff}
  .modchip svg.ic{width:11px;height:11px}.modchip .lk{color:#b3b0a4}
  /* gated module page */
  .gate{background:#fff;border:1px solid var(--linha);border-radius:20px;padding:34px 24px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.03)}
  .gate .gi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;margin:0 auto 12px}
  .gate h2{margin:0 0 6px;font-size:18px;font-weight:800}
  .gate p{margin:0 auto 18px;font-size:13px;color:var(--cinza);max-width:400px;line-height:1.5}
  .gate .cta{border:none;border-radius:12px;padding:11px 20px;font:inherit;font-weight:800;font-size:13px;color:#fff;cursor:pointer}
  .hide{display:none!important}
  .note{background:#fff;border:1px dashed var(--linha);border-radius:14px;padding:12px 14px;margin-top:16px;font-size:12.5px;color:var(--cinza)}
  .note b{color:var(--tinta)}
  .back{border:none;background:transparent;font:inherit;font-size:12.5px;font-weight:700;color:var(--cinza);cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">

  <div class="scn"><span class="lb">Cenário</span>
    <button class="on" data-s="full">Plano completo</button>
    <button data-s="post">Só Cria Post</button>
    <button data-s="none">Sem módulos</button>
  </div>

  <div class="chead">
    <div class="avatar" style="background:var(--verde)">MA</div>
    <div><h1>Marina Alves</h1><div class="sub muted">@marina.studio · cliente desde mar/2025</div></div>
    <div class="right">
      <button class="hbtn"><svg class="ic"><use href="#i-link"/></svg> Portal do cliente</button>
      <button class="hbtn"><svg class="ic"><use href="#i-arrow"/></svg> Entrar no Cria dele</button>
    </div>
  </div>

  <!-- NAV nível 1 -->
  <div class="nav" id="nav"></div>

  <!-- painel dinâmico -->
  <div id="panel"></div>

  <div class="note" id="note"></div>
</div>

<svg width="0" height="0" style="position:absolute"><defs>
  <g id="i-home"><path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/></g>
  <g id="i-layers"><polygon points="12 3 21 8 12 13 3 8"/><polyline points="3 13 12 18 21 13"/></g>
  <g id="i-book"><path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4z"/><path d="M5 16h13"/></g>
  <g id="i-wallet"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M16 11h3"/></g>
  <g id="i-compass"><circle cx="12" cy="12" r="9"/><polygon points="15.5 8.5 11 11 8.5 15.5 13 13"/></g>
  <g id="i-insta"><rect x="4" y="4" width="16" height="16" rx="4.5"/><circle cx="12" cy="12" r="3.5"/><circle cx="17" cy="7" r="1"/></g>
  <g id="i-check"><polyline points="4 12 9 17 20 6"/></g>
  <g id="i-cal"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 3v3M16 3v3"/></g>
  <g id="i-chart"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></g>
  <g id="i-bulb"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10c1 1 1 2 1 3h6c0-1 0-2 1-3a6 6 0 0 0-4-10z"/></g>
  <g id="i-search"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></g>
  <g id="i-tag"><path d="M4 4h7l9 9-7 7-9-9z"/><circle cx="8.5" cy="8.5" r="1.3"/></g>
  <g id="i-id"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2"/><path d="M14 10h4M14 13h4M6 15h6"/></g>
  <g id="i-arrow"><path d="M5 12h14"/><polyline points="13 6 19 12 13 18"/></g>
  <g id="i-back"><path d="M19 12H5"/><polyline points="11 6 5 12 11 18"/></g>
  <g id="i-link"><path d="M9 15l6-6"/><path d="M10.5 6.5l1.5-1.5a4 4 0 0 1 6 6l-2 2"/><path d="M13.5 17.5l-1.5 1.5a4 4 0 0 1-6-6l2-2"/></g>
  <g id="i-lock"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g>
</defs></svg>

<script>
  const MOD={
    post:{name:'Cria Post',color:'var(--laranja)',ic:'i-layers',tag:'o conteúdo da Marina',
      subs:[
        {t:'Produção',ic:'i-layers',d:'Kanban dos posts em 5 status: em produção → aguardando → ajuste → aprovado → postado.',badge:'6 em andamento',hot:1},
        {t:'Cronograma',ic:'i-cal',d:'Calendário do mês com todos os posts que têm data, na cor do status.',badge:'julho'},
        {t:'Aprovações',ic:'i-check',d:'Fila cronológica do que espera o cliente aprovar no portal.',badge:'3 pendentes',hot:1},
        {t:'Relatório',ic:'i-chart',d:'Resultado white-label do mês pra enviar pro cliente.',badge:'jun fechado'}
      ]},
    gestao:{name:'Cria Gestão',color:'var(--rosa)',ic:'i-book',tag:'a marca e o relacionamento',
      subs:[
        {t:'Brandbook',ic:'i-book',d:'Paleta, tom de voz, personas e moodboard. Preenchido pelo cliente.',badge:'completo'},
        {t:'Contato & Contrato',ic:'i-id',d:'E-mail, WhatsApp, contrato, renovação e dia de pagamento.',badge:'renova 01/set'},
        {t:'Etiquetas',ic:'i-tag',d:'Status e marcadores do cliente (VIP, plano, situação).',badge:'2 etiquetas'}
      ]},
    caixa:{name:'Cria Caixa',color:'var(--azul)',ic:'i-wallet',tag:'o financeiro deste cliente',
      subs:[
        {t:'Financeiro',ic:'i-wallet',d:'Mensalidade, a receber, custo de produção e rentabilidade só deste cliente.',badge:'64% margem'}
      ]},
    radar:{name:'Cria Radar',color:'var(--lilas)',ic:'i-compass',tag:'ideias e inteligência de nicho',
      subs:[
        {t:'Ideias',ic:'i-bulb',d:'Banco de ideias e ganchos pra transformar em post.',badge:'12 salvas'},
        {t:'Pesquisa',ic:'i-search',d:'Concorrência e tendências do nicho da cliente.',badge:'3 concorrentes'}
      ]},
  };
  const INSTA={name:'Instagram',color:'#C13584',ic:'i-insta'};
  const scenarios={full:{post:1,gestao:1,caixa:1,radar:1},post:{post:1,gestao:0,caixa:0,radar:1},none:{post:0,gestao:0,caixa:0,radar:0}};
  let S=scenarios.full, view='visao';

  function icon(id){return `<svg class="ic"><use href="#${id}"/></svg>`}

  function renderNav(){
    const N=document.getElementById('nav');
    let h=`<button class="n1 ${view==='visao'?'active':''}" data-v="visao"><span class="mc" style="background:var(--tinta)">${icon('i-home')}</span>Visão geral</button>`;
    Object.keys(MOD).forEach(k=>{const m=MOD[k];const on=S[k];
      h+=`<button class="n1 ${view===k?'active':''} ${on?'':'lock'}" data-v="${k}">
        <span class="mc" style="background:${m.color}">${icon(m.ic)}</span>${m.name}${on?'':' '+`<svg class="ic lk"><use href="#i-lock"/></svg>`}</button>`;});
    h+=`<button class="n1 ${view==='insta'?'active':''}" data-v="insta"><span class="mc" style="background:${INSTA.color}">${icon(INSTA.ic)}</span>Instagram</button>`;
    N.innerHTML=h;
    N.querySelectorAll('.n1').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.v;render();}));
  }

  function baseFicha(){
    return `<div class="sechead"><span class="mc" style="background:var(--tinta)">${icon('i-id')}</span>Dados do cliente</div>
    <div class="card" style="margin-bottom:16px">
      <div class="basegrid">
        <div class="bx"><div class="k">Segmento</div><div class="v">Skincare · Estética</div></div>
        <div class="bx"><div class="k">WhatsApp</div><div class="v">(11) 9 9999-0000</div></div>
        <div class="bx"><div class="k">E-mail</div><div class="v">marina@studio.com</div></div>
        <div class="bx"><div class="k">Plano</div><div class="v">Gestão completa</div></div>
        <div class="bx"><div class="k">Mensalidade</div><div class="v">R$ 1.800</div></div>
        <div class="bx"><div class="k">Dia de pagamento</div><div class="v">05</div><div class="hint">nasce no Caixa nesse dia</div></div>
        <div class="bx"><div class="k">Renovação</div><div class="v">01/set</div></div>
        <div class="bx"><div class="k">Cliente desde</div><div class="v">mar/2025</div></div>
      </div>
      <div class="anot"><div class="k">Anotações <span class="muted" style="margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600">Salva automático</span></div>
        <textarea>Contexto, combinados, senhas de acesso, o que o cliente odeia…</textarea></div>
    </div>`;
  }

  function upsell(){
    const missing=Object.keys(MOD).filter(k=>!S[k]);
    if(!missing.length)return '';
    return `<div class="ups"><span class="ut">Amplie este cliente:</span>`+missing.map(k=>
      `<button class="modchip"><span class="mc" style="background:${MOD[k].color}">${icon(MOD[k].ic)}</span>${MOD[k].name}<svg class="ic lk"><use href="#i-lock"/></svg></button>`).join('')+`</div>`;
  }

  function visaoGeral(){
    const any=S.post||S.gestao||S.caixa||S.radar;
    let hl='';
    if(any){
      hl+=`<div class="sechead"><span class="mc" style="background:var(--tinta)">${icon('i-home')}</span>Destaques <small>o resumo — o detalhe fica em cada Cria acima</small></div><div class="hl">`;
      if(S.post){
        hl+=`<div class="card"><div class="ttl"><span class="dot" style="background:var(--laranja)"></span>Precisa de você <button class="goto" data-v="post">Abrir Cria Post ${icon('i-arrow')}</button></div>
          <div class="fitem"><div><div class="t">Reels · Bastidores do lançamento</div><div class="d">Aguardando há <span class="aged">4 dias</span></div></div><span class="st waiting">Aguardando</span></div>
          <div class="fitem"><div><div class="t">Carrossel · 5 erros de quem começa</div><div class="d">Cliente pediu ajuste</div></div><span class="st adjust">Em ajuste</span></div></div>`;
      }
      if(S.caixa){
        hl+=`<div class="card"><div class="ttl"><span class="dot" style="background:var(--azul)"></span>Caixa do cliente <button class="goto" data-v="caixa">Abrir Cria Caixa ${icon('i-arrow')}</button></div>
          <div class="fin"><div class="finbox"><div class="k">A receber</div><div class="v" style="color:var(--verde)">R$ 1.800</div></div>
          <div class="finbox"><div class="k">Custo</div><div class="v">R$ 640</div></div>
          <div class="finbox"><div class="k">Rentabilidade</div><div class="v" style="color:var(--verde)">64%</div></div>
          <div class="finbox"><div class="k">Renova</div><div class="v">01/set</div></div></div></div>`;
      }
      hl+=`<div class="card"><div class="ttl"><span class="dot" style="background:var(--laranja)"></span>Próximas datas</div>
        <div class="fitem"><div class="t">Dia do Amigo</div><span class="st" style="background:var(--creme);color:var(--cinza)">20 jul</span></div>
        <div class="fitem"><div class="t">Aniversário da Marina</div><span class="st" style="background:var(--creme);color:var(--cinza)">28 jul</span></div></div>`;
      if(S.radar){
        hl+=`<div class="card"><div class="ttl"><span class="dot" style="background:var(--lilas)"></span>Do Radar <button class="goto" data-v="radar">Abrir Cria Radar ${icon('i-arrow')}</button></div>
          <div class="fitem"><div class="t">12 ideias salvas prontas pra virar post</div></div>
          <div class="fitem"><div class="t">Concorrente subiu 3 reels esta semana</div></div></div>`;
      }
      hl+=`</div>`;
    }
    return baseFicha()+hl+upsell();
  }

  function moduleView(k){
    const m=MOD[k];
    if(!S[k]){
      return `<button class="back" data-v="visao">${icon('i-back')} Voltar</button>
      <div class="gate"><div class="gi" style="background:${m.color}">${icon('i-lock')}</div>
        <h2>${m.name} não está no seu plano</h2>
        <p>Ative pra pilotar ${m.tag} da Marina aqui dentro: ${m.subs.map(s=>s.t.toLowerCase()).join(', ')}.</p>
        <button class="cta" style="background:${m.color}">Conhecer o ${m.name}</button></div>`;
    }
    let h=`<button class="back" data-v="visao">${icon('i-back')} Voltar</button>
      <div class="sechead"><span class="mc" style="background:${m.color}">${icon(m.ic)}</span>${m.name} <small>${m.tag}</small></div>
      <div class="subgrid">`;
    m.subs.forEach(s=>{
      h+=`<div class="subcard"><div class="top"><span class="si" style="background:${m.color}">${icon(s.ic)}</span><span class="st">${s.t}</span></div>
        <div class="sd">${s.d}</div>
        <div class="foot"><span class="badge ${s.hot?'hot':''}">${s.badge}</span><span class="go">Abrir ${icon('i-arrow')}</span></div></div>`;
    });
    h+=`</div>`;
    return h;
  }

  function instaView(){
    return `<button class="back" data-v="visao">${icon('i-back')} Voltar</button>
      <div class="sechead"><span class="mc" style="background:${INSTA.color}">${icon(INSTA.ic)}</span>Instagram <small>insights dos posts publicados</small></div>
      <div class="card"><p class="muted" style="margin:0;font-size:13px">Alcance, salvamentos e melhor horário por post publicado, ligados ao Cria Post. (conteúdo resumido no mockup)</p></div>`;
  }

  function render(){
    renderNav();
    const P=document.getElementById('panel');
    if(view==='visao')P.innerHTML=visaoGeral();
    else if(view==='insta')P.innerHTML=instaView();
    else P.innerHTML=moduleView(view);
    // atalhos internos (destaques -> módulo, upsell, voltar)
    P.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.v;render();}));
    document.getElementById('note').innerHTML = view==='visao'
      ? '<b>Dois níveis:</b> no topo você escolhe QUAL Cria; ao entrar, cards mostram O QUE tem dentro. A Visão geral é só a ficha do cliente + os destaques de cada Cria. Nada de menu gigante.'
      : '<b>Nível 2:</b> cada assunto é um card. Clicar num card abre a ferramenta cheia daquele assunto (kanban, calendário, etc.). O botão Voltar retorna pra Visão geral.';
  }

  document.querySelectorAll('.scn button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.scn button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    S=scenarios[b.dataset.s];
    if(view!=='visao'&&view!=='insta'&&!S[view])view='visao';
    render();}));
  render();
</script>
</body>
</html>
