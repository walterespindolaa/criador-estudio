<!doctype html>
  <html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Removido maximum-scale/user-scalable=no: bloquear zoom é barreira de acessibilidade
         (WCAG 1.4.4). O input font de 16px (index.css) já evita o auto-zoom chato do iOS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cria Social Club | Seu Estúdio Criativo</title>
    <meta name="description" content="Da ideia ao publicado: organize, planeje e crie conteúdo para redes sociais em um só lugar.">
    <meta name="author" content="cria" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.gpteng.co https://fonts.googleapis.com https://accounts.google.com https://apis.google.com https://connect.facebook.net https://www.googletagmanager.com https://www.google-analytics.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com;
      font-src 'self' https://fonts.gstatic.com https://cdn.gpteng.co;
      img-src 'self' data: https: blob:;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.gpteng.co https://api.anthropic.com https://www.googleapis.com https://accounts.google.com https://video.bunnycdn.com https://www.facebook.com https://connect.facebook.net https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://*.ingest.us.sentry.io https://*.ingest.sentry.io https://*.sentry.io;
      frame-src 'self' https://drive.google.com https://accounts.google.com https://docs.google.com https://iframe.mediadelivery.net;
      worker-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
    ">

    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://app.criasocialclub.com.br/logo-cria.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://app.criasocialclub.com.br/logo-cria.png">
    <meta property="og:url" content="https://app.criasocialclub.com.br" />
    <meta property="og:site_name" content="Cria Social Club" />
    <link rel="canonical" href="https://app.criasocialclub.com.br" />
    <!-- A bio pública faz a primeira chamada ao banco antes de pintar
         qualquer coisa. Sem preconnect, essa chamada paga DNS + TLS na hora
         errada: no 4G isso é uns 300ms de rodinha a mais, sempre. -->
    <link rel="preconnect" href="https://exuxlwdnkgmhtnwoyvwo.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://exuxlwdnkgmhtnwoyvwo.supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,500;0,6..12,600;0,6..12,700;1,6..12,400&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Grand+Hotel&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json">
    <!-- theme-color estava roxo (#8B5CF6), cor que não existe mais na identidade.
         Agora é o laranja do CRIA, e muda no modo escuro. -->
    <meta name="theme-color" content="#CE4A1D" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1B1A17" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- default deixava uma barra branca feia; black-translucent faz o conteúdo
         subir até o topo, com o safe-area cuidando do notch. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CRIA">
    <!-- Sem isso o iPhone abre o app instalado numa tela branca e a pessoa acha
         que quebrou. Reaproveita o ícone: não é o ideal, mas é infinitamente
         melhor que o vazio. -->
    <link rel="apple-touch-startup-image" href="/app-icon-512.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- A logo aparece no loading entre páginas. Sem preload, o PNG só baixa na
         hora e pisca em branco na primeira vez. Pré-carrega as duas (clara e
         escura) pra ela pintar na hora. -->
    <link rel="preload" as="image" href="/logo-cria.png" />
    <link rel="preload" as="image" href="/logo-cria-white.png" />
  <meta property="og:title" content="Cria Social Club | Seu Estúdio Criativo">
  <meta name="twitter:title" content="Cria Social Club | Seu Estúdio Criativo">
  <meta property="og:description" content="Da ideia ao publicado: organize, planeje e crie conteúdo para redes sociais em um só lugar.">
  <meta name="twitter:description" content="Da ideia ao publicado: organize, planeje e crie conteúdo para redes sociais em um só lugar.">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
